server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: unknown routes hit the Angular app
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache immutable hashed assets
  location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|svg|webp|webmanifest)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Never cache index.html or the service worker
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location = /ngsw-worker.js {
    add_header Cache-Control "no-store";
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;
  gzip_min_length 1024;
}
